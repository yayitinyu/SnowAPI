name: CI and Native Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-native-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check default frontend
        working-directory: web/default
        run: |
          bun run typecheck
          bun run lint
          bun run build

      - name: Check classic frontend
        working-directory: web/classic
        run: bun run build

      - name: Remove frontend dependencies before Go package discovery
        run: rm -rf web/node_modules

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend tests
        run: go test ./...

  docker:
    name: Native Docker image (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs:
      - ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            runner_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write image version
        shell: bash
        run: echo "sha-${GITHUB_SHA::12}" > VERSION

      - name: Resolve image tag
        id: image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "arch_tag=${image}:sha-${short_sha}-${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Verify native runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: |
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "$EXPECTED_ARCH" ]; then
            echo "::error::Expected native runner architecture $EXPECTED_ARCH, got $actual_arch"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.arch_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,scope=native-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test native image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.arch_tag }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE"
          actual_arch="$(docker image inspect "$IMAGE" --format '{{.Architecture}}')"
          if [ "$actual_arch" != "$EXPECTED_ARCH" ]; then
            echo "::error::Expected image architecture $EXPECTED_ARCH, got $actual_arch"
            exit 1
          fi

          cleanup() {
            docker rm --force snowapi-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name snowapi-ci \
            --publish 127.0.0.1:3000:3000 \
            --env SESSION_SECRET=ci-native-image-session-secret \
            --env CRYPTO_SECRET=ci-native-image-crypto-secret \
            "$IMAGE"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/status | grep --quiet '"success":true'; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Container health check did not become ready"
          docker logs --tail 200 snowapi-ci
          exit 1

  manifest:
    name: Merge multi-architecture image
    if: github.event_name != 'pull_request'
    needs:
      - docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create multi-architecture manifests
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          amd64_image="${IMAGE}:sha-${SHORT_SHA}-amd64"
          arm64_image="${IMAGE}:sha-${SHORT_SHA}-arm64"
          sha_image="${IMAGE}:sha-${SHORT_SHA}"

          docker buildx imagetools create \
            --tag "$sha_image" \
            "$amd64_image" \
            "$arm64_image"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "$amd64_image" \
              "$arm64_image"
          fi

      - name: Verify merged platforms
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          target="${IMAGE}:sha-${SHORT_SHA}"
          raw_manifest="$(docker buildx imagetools inspect "$target" --raw)"
          platforms="$(jq --raw-output \
            '.manifests[] | select(.platform.os == "linux") | .platform.architecture' \
            <<< "$raw_manifest" | sort --unique)"

          grep --fixed-strings --line-regexp 'amd64' <<< "$platforms"
          grep --fixed-strings --line-regexp 'arm64' <<< "$platforms"
          docker buildx imagetools inspect "$target"

      - name: Write image summary
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          echo "### Multi-architecture image" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "- ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
